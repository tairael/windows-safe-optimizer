name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repository tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Run-AllTests.ps1
